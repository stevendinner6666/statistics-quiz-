<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>統計學題庫練習</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>
*{box-sizing:border-box}
body{font-family:Arial,"Microsoft JhengHei",sans-serif;background:#f2f4fa;color:#202944;margin:0}
header{background:#202d50;color:white;padding:25px;text-align:center}
main{max-width:850px;margin:25px auto;padding:15px}
.card{background:white;padding:22px;border-radius:16px;margin-bottom:18px;box-shadow:0 3px 15px #0001}
button,select{padding:12px;border:0;border-radius:9px;margin:5px;cursor:pointer;font-size:15px}
button{background:#465bd8;color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.option{display:block;width:100%;text-align:left;background:#f1f3fa;color:#202944;margin:10px 0}
.option.selected{background:#dce3ff;border:2px solid #465bd8}
#feedback{padding:15px;background:#f0f3fa;border-radius:10px;margin-top:15px}
.hidden{display:none}
.muted{color:#788198}
.notice{padding:12px;background:#f0f3fa;border-radius:9px;margin:12px 0}
input[type=file]{max-width:100%;margin:10px 0}
#preview{max-height:450px;overflow:auto}
#preview li{margin:12px 0;line-height:1.6}
.correct{background:#d8f5e6!important}
.wrong{background:#ffe0e3!important}
</style>
</head>

<body>

<header>
<h1>📚 統計學題庫練習系統</h1>
<p>隨機測驗・即時批改・錯題複習・多 PDF 批次匯入</p>
</header>

<main>

<div class="card" id="home">
<h2>開始練習</h2>
<p id="info">目前尚未匯入題庫</p>

<label>測驗範圍：</label>
<select id="chapter">
<option value="all">全部章節</option>
</select>

<label>題目數量：</label>
<select id="amount">
<option value="10">10 題</option>
<option value="20">20 題</option>
<option value="30">30 題</option>
<option value="all">全部題目</option>
</select>
<br>
<button onclick="start()">開始測驗</button>
<button onclick="start(true)">錯題練習</button>
<button onclick="clearWrong()">清除錯題</button>
</div>

<div class="card">
<h3>📊 練習統計</h3>
<p>累計作答：<b id="total">0</b></p>
<p>累計答對：<b id="correct">0</b></p>
<p>正確率：<b id="rate">0%</b></p>
</div>

<div class="card hidden" id="quiz">
<p id="progress"></p>
<p id="questionChapter" class="muted"></p>
<h3 id="question"></h3>
<div id="options"></div>
<div id="feedback" class="hidden"></div>
<br>
<button onclick="check()">確認答案</button>
<button onclick="next()">下一題</button>
<button onclick="finish()">交卷</button>
</div>

<div class="card hidden" id="result">
<h2>測驗結果</h2>
<h3 id="score"></h3>
<div id="review"></div>
<button onclick="goHome()">回首頁</button>
</div>

<div class="card">
<h3>📥 多份 PDF 批次匯入</h3>
<p>可以一次選取多個 PDF，系統會逐一辨識並整合成一份新題庫。</p>

<div class="notice">
<b>匯入規則</b>
<ul>
<li>每份 PDF 的檔名會成為章節名稱。</li>
<li>題目需要有 A、B、C、D 四個選項及 ANSWER 答案，才會匯入。</li>
<li>不符合選擇題格式的題目會略過。</li>
<li>確認匯入後，會取代原本題庫。</li>
</ul>
</div>

<input type="file" id="pdfFiles" accept=".pdf,application/pdf" multiple>
<p id="fileCount" class="muted">尚未選擇檔案</p>

<button id="pdfButton" onclick="readPDFs()">開始批次讀取</button>

<div id="pdfStatus" class="notice hidden"></div>
<div id="preview" class="hidden"></div>

<button id="confirmPDF" class="hidden" onclick="confirmPDFImport()">
確認匯入全部題目
</button>
</div>

<div class="card">
<h3>📄 匯入 JSON 題庫</h3>
<p class="muted">仍然保留原本 JSON 匯入功能。</p>
<input type="file" id="jsonFile" accept=".json">
<br>
<button onclick="importJSON()">匯入 JSON</button>
</div>

</main>

<script>
if(window.pdfjsLib){
  pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let bank=JSON.parse(localStorage.getItem("bank")||"[]");
let wrong=JSON.parse(localStorage.getItem("wrong")||"[]");
let total=Number(localStorage.getItem("total")||0);
let correct=Number(localStorage.getItem("correct")||0);

let questions=[],index=0,answers={},done={};
let pendingPDFQuestions=[];
let pdfSummaries=[];

document.getElementById("pdfFiles").addEventListener("change",function(){
  let files=this.files;
  document.getElementById("fileCount").textContent=
    files.length ? "已選擇 "+files.length+" 個 PDF 檔案" : "尚未選擇檔案";

  pendingPDFQuestions=[];
  pdfSummaries=[];
  document.getElementById("preview").classList.add("hidden");
  document.getElementById("confirmPDF").classList.add("hidden");
  document.getElementById("pdfStatus").classList.add("hidden");
});

function save(){
  localStorage.setItem("bank",JSON.stringify(bank));
  localStorage.setItem("wrong",JSON.stringify(wrong));
  localStorage.setItem("total",total);
  localStorage.setItem("correct",correct);
}

function escapeHTML(value){
  return String(value).replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

function update(){
  document.getElementById("info").textContent=
    "目前共有 "+bank.length+" 題，分布於 "+
    new Set(bank.map(q=>q.chapter)).size+" 個章節";

  document.getElementById("total").textContent=total;
  document.getElementById("correct").textContent=correct;
  document.getElementById("rate").textContent=
    total?Math.round(correct/total*100)+"%":"0%";

  let chapters=[...new Set(bank.map(q=>q.chapter||"未分類"))];

  document.getElementById("chapter").innerHTML=
    '<option value="all">全部章節</option>'+
    chapters.map(c=>
      `<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`
    ).join("");
}

/* 開始測驗 */
function start(onlyWrong=false){
  let selected=bank.filter(q=>
    (!onlyWrong||wrong.includes(String(q.id)))&&
    (document.getElementById("chapter").value==="all"||
    q.chapter===document.getElementById("chapter").value)
  );

  if(!selected.length){
    alert("沒有可練習的題目，請先匯入題庫！");
    return;
  }

  selected.sort(()=>Math.random()-.5);

  let amount=document.getElementById("amount").value;
  questions=selected.slice(0,amount==="all"?selected.length:Number(amount));

  index=0;
  answers={};
  done={};

  document.getElementById("home").classList.add("hidden");
  document.getElementById("quiz").classList.remove("hidden");
  document.getElementById("result").classList.add("hidden");

  show();
}

function show(){
  let q=questions[index];

  document.getElementById("progress").textContent=
    `第 ${index+1} 題 / 共 ${questions.length} 題`;

  document.getElementById("questionChapter").textContent=q.chapter||"未分類";
  document.getElementById("question").textContent=q.question;
  document.getElementById("options").innerHTML="";

  for(let [key,value] of Object.entries(q.options)){
    let b=document.createElement("button");
    b.className="option"+(answers[q.id]===key?" selected":"");
    b.textContent=key.toUpperCase()+". "+value;
    b.disabled=!!done[q.id];

    b.onclick=()=>{
      if(done[q.id])return;
      answers[q.id]=key;
      show();
    };

    document.getElementById("options").appendChild(b);
  }

  document.getElementById("feedback").classList.add("hidden");

  if(done[q.id])showFeedback(q);
}

function check(){
  let q=questions[index];

  if(!answers[q.id]){
    alert("請先選擇答案！");
    return;
  }

  if(done[q.id])return;

  done[q.id]=true;
  total++;

  let ok=answers[q.id]===q.answer;

  if(ok){
    correct++;
    wrong=wrong.filter(x=>x!==String(q.id));
  }else if(!wrong.includes(String(q.id))){
    wrong.push(String(q.id));
  }

  save();
  show();
  showFeedback(q);
  update();
}

function showFeedback(q){
  let ok=answers[q.id]===q.answer;
  let f=document.getElementById("feedback");

  f.classList.remove("hidden");
  f.innerHTML=
    `<b>${ok?"答對了！":"答錯了！正確答案："+escapeHTML(q.answer.toUpperCase())}</b>
    <p>${escapeHTML(q.explanation||"暫無解析")}</p>`;
}

function next(){
  if(index<questions.length-1){
    index++;
    show();
  }else{
    finish();
  }
}

function finish(){
  let right=questions.filter(q=>answers[q.id]===q.answer).length;

  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.remove("hidden");

  document.getElementById("score").textContent=
    `答對 ${right} 題，答錯 ${questions.length-right} 題，正確率 ${Math.round(right/questions.length*100)}%`;

  document.getElementById("review").innerHTML=questions.map((q,i)=>`
    <hr>
    <p><b>${i+1}. ${escapeHTML(q.question)}</b></p>
    <p>章節：${escapeHTML(q.chapter)}</p>
    <p>你的答案：${escapeHTML((answers[q.id]||"未作答").toUpperCase())}
    ｜正確答案：${escapeHTML(q.answer.toUpperCase())}</p>
    <p>${escapeHTML(q.explanation||"暫無解析")}</p>
  `).join("");
}

function goHome(){
  document.getElementById("result").classList.add("hidden");
  document.getElementById("home").classList.remove("hidden");
}

function clearWrong(){
  if(confirm("確定清除錯題紀錄？")){
    wrong=[];
    save();
    alert("已清除！");
  }
}

/* JSON 匯入 */
function importJSON(){
  let file=document.getElementById("jsonFile").files[0];

  if(!file){
    alert("請先選擇 JSON 檔案！");
    return;
  }

  file.text().then(text=>{
    let data=JSON.parse(text);

    if(!Array.isArray(data)){
      throw Error("題庫格式必須是陣列");
    }

    data.forEach((q,i)=>{
      if(!q.question||!q.options||!q.answer||!(q.answer in q.options)){
        throw Error("第 "+(i+1)+" 題資料不完整");
      }
      q.id=String(q.id??i+1);
    });

    bank=data;
    wrong=[];
    save();
    update();

    alert("成功匯入 "+bank.length+" 題！");
  }).catch(e=>{
    alert("匯入失敗："+e.message);
  });
}

/* PDF 文字擷取 */
async function extractPDFLines(file){
  if(!window.pdfjsLib){
    throw new Error("PDF 讀取程式載入失敗，請重新整理網頁後再試。");
  }

  let buffer=await file.arrayBuffer();

  let pdf=await pdfjsLib.getDocument({
    data:new Uint8Array(buffer)
  }).promise;

  let allLines=[];

  for(let pageNo=1;pageNo<=pdf.numPages;pageNo++){
    let page=await pdf.getPage(pageNo);
    let content=await page.getTextContent();
    let rows=[];

    for(let item of content.items){
      if(!item.str||!item.str.trim())continue;

      let y=Math.round(item.transform[5]);
      let x=item.transform[4];

      let row=rows.find(r=>Math.abs(r.y-y)<=2);

      if(!row){
        row={y:y,items:[]};
        rows.push(row);
      }

      row.items.push({x:x,text:item.str.trim()});
    }

    rows.sort((a,b)=>b.y-a.y);

    for(let row of rows){
      row.items.sort((a,b)=>a.x-b.x);
      let line=row.items.map(x=>x.text).join(" ").trim();
      if(line)allLines.push(line);
    }
  }

  return allLines;
}

/* 解析單份 PDF */
function parseQuestions(lines,chapter,prefix){
  let parsed={};
  let current=null;
  let currentOption=null;

  function addText(target,text){
    if(!text)return;

    if(target==="question"){
      current.question+=" "+text;
    }else if(target){
      current.options[target]+=" "+text;
    }
  }

  for(let original of lines){
    let line=original.replace(/\s+/g," ").trim();
    if(!line)continue;

    // 擷取 ANSWER
    let answerMatch=line.match(/ANSWER\s*:\s*([a-d])\b/i);

    if(answerMatch&&current){
      current.answer=answerMatch[1].toLowerCase();
      line=line.replace(/ANSWER\s*:\s*[a-d]\b/i,"").trim();
    }

    // 跳過常見頁首頁尾
    if(/^(Name:|Class:|Date:|Copyright Cengage|Powered by Cognero|Page \d+|Multiple Choice)/i.test(line)){
      continue;
    }

    // 判斷新題目
    let qMatch=line.match(/^(\d{1,3})\.\s*(.*)$/);

    if(qMatch){
      let number=Number(qMatch[1]);

      current=parsed[number]||{
        number:number,
        question:"",
        options:{a:"",b:"",c:"",d:""},
        answer:""
      };

      parsed[number]=current;
      currentOption=null;

      addText("question",qMatch[2]);
      continue;
    }

    if(!current)continue;

    // 判斷選項
    let optionMatch=line.match(/^([a-d])\.\s*(.*)$/i);

    if(optionMatch){
      currentOption=optionMatch[1].toLowerCase();
      current.options[currentOption]=optionMatch[2].trim();
      continue;
    }

    // 接續前一行內容
    if(currentOption){
      addText(currentOption,line);
    }else{
      addText("question",line);
    }
  }

  let result=[];
  let problems=[];

  let numbers=Object.keys(parsed).map(Number).sort((a,b)=>a-b);

  for(let number of numbers){
    let q=parsed[number];

    q.question=q.question.trim();

    for(let key of ["a","b","c","d"]){
      q.options[key]=q.options[key].trim();
    }

    let missing=Object.keys(q.options).filter(k=>!q.options[k]);

    if(!q.question||missing.length||!q.answer||
       !(q.answer in q.options)){
      problems.push(
        "第 "+number+" 題未完整辨識"+
        (missing.length?"（缺少選項 "+missing.join(",")+"）":"")+
        (!q.answer?"（缺少答案）":"")
      );
      continue;
    }

    result.push({
      id:prefix+"-q"+number,
      chapter:chapter,
      question:q.question,
      options:q.options,
      answer:q.answer,
      explanation:"暫無解析"
    });
  }

  return {
    questions:result,
    problems:problems,
    detected:numbers.length
  };
}

/* 多份 PDF 批次讀取 */
async function readPDFs(){
  let files=Array.from(document.getElementById("pdfFiles").files);

  if(!files.length){
    alert("請先選擇至少一份 PDF！");
    return;
  }

  let button=document.getElementById("pdfButton");
  let status=document.getElementById("pdfStatus");
  let preview=document.getElementById("preview");
  let confirmButton=document.getElementById("confirmPDF");

  button.disabled=true;
  button.textContent="批次讀取中...";
  status.classList.remove("hidden");
  preview.classList.add("hidden");
  confirmButton.classList.add("hidden");

  pendingPDFQuestions=[];
  pdfSummaries=[];

  try{
    for(let i=0;i<files.length;i++){
      let file=files[i];

      status.textContent=
        `正在讀取第 ${i+1}/${files.length} 份 PDF：${file.name}`;

      let lines=await extractPDFLines(file);

      let chapter=file.name.replace(/\.pdf$/i,"");
      let prefix="pdf"+(i+1);

      let result=parseQuestions(lines,chapter,prefix);

      pendingPDFQuestions.push(...result.questions);

      pdfSummaries.push({
        name:file.name,
        chapter:chapter,
        count:result.questions.length,
        detected:result.detected,
        problems:result.problems
      });
    }

    let totalQuestions=pendingPDFQuestions.length;

    status.innerHTML=
      `<b>批次讀取完成！</b><br>
      選取檔案：${files.length} 份<br>
      成功辨識：${totalQuestions} 題`;

    status.innerHTML+=
      "<hr><b>各檔案辨識結果：</b><ul>"+
      pdfSummaries.map(s=>
        `<li>${escapeHTML(s.name)}：
        成功 ${s.count} 題／辨識到 ${s.detected} 個題號
        ${s.problems.length?
          `<br><span style="color:#bd3845">有 ${s.problems.length} 題未完整辨識</span>`:
          ""}
        </li>`
      ).join("")+"</ul>";

    preview.classList.remove("hidden");

    preview.innerHTML=
      "<h3>題目預覽（每份 PDF 最多顯示前 3 題）</h3>"+
      pdfSummaries.map(s=>{
        let sample=pendingPDFQuestions
          .filter(q=>q.chapter===s.chapter)
          .slice(0,3);

        return `
          <hr>
          <h4>${escapeHTML(s.chapter)}（${s.count} 題）</h4>
          <ol>
          ${sample.map(q=>`
            <li>
              <b>${escapeHTML(q.question)}</b><br>
              A. ${escapeHTML(q.options.a)}<br>
              B. ${escapeHTML(q.options.b)}<br>
              C. ${escapeHTML(q.options.c)}<br>
              D. ${escapeHTML(q.options.d)}<br>
              正確答案：${escapeHTML(q.answer.toUpperCase())}
            </li>
          `).join("")}
          </ol>
        `;
      }).join("");

    if(totalQuestions>0){
      confirmButton.classList.remove("hidden");
      confirmButton.textContent="確認匯入全部 "+totalQuestions+" 題";
    }else{
      status.innerHTML+="<p>沒有辨識到完整的選擇題，請檢查 PDF 格式。</p>";
    }

  }catch(error){
    status.innerHTML=
      `<b>讀取過程發生錯誤：</b><br>${escapeHTML(error.message)}<br>
      請檢查 PDF 是否正常，並重新嘗試。`;

    pendingPDFQuestions=[];
    pdfSummaries=[];
  }finally{
    button.disabled=false;
    button.textContent="開始批次讀取";
  }
}

/* 確認匯入：取代舊題庫 */
function confirmPDFImport(){
  if(!pendingPDFQuestions.length){
    alert("目前沒有可匯入的題目！");
    return;
  }

  let message=
    "確定以這批 PDF 取代原本題庫嗎？\n\n"+
    "PDF 檔案數："+pdfSummaries.length+"\n"+
    "新題庫題數："+pendingPDFQuestions.length+"\n\n"+
    "原本題庫的題目將被取代。";

  if(!confirm(message))return;

  bank=pendingPDFQuestions;

  // 舊題庫的錯題 ID 不再適用，清除舊錯題紀錄
  wrong=[];

  save();
  update();

  alert(
    "成功匯入 "+bank.length+
    " 題！共 "+pdfSummaries.length+" 個章節。"
  );

  pendingPDFQuestions=[];
  pdfSummaries=[];

  document.getElementById("preview").classList.add("hidden");
  document.getElementById("confirmPDF").classList.add("hidden");
  document.getElementById("pdfStatus").classList.add("hidden");
  document.getElementById("pdfFiles").value="";
  document.getElementById("fileCount").textContent="尚未選擇檔案";
}

update();
</script>

</body>
</html>
